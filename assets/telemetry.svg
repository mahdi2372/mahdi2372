<svg width="1400" height="270" viewBox="0 0 1400 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mahdi engineering telemetry</title>
  <desc id="desc">A local, reliable profile dashboard showing engineering status and focus areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="56" y1="80" x2="1344" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1400" height="270" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="270" rx="24" fill="url(#grid)"/>
  <text x="58" y="55" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="3">ENGINEERING TELEMETRY</text>
  <text x="58" y="84" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="1">A PROFILE SNAPSHOT — LIVE WORK HAPPENS IN THE REPOSITORIES</text>
  <path d="M58 108H1342" stroke="url(#line)" stroke-width="2"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(58 137)">
      <rect width="290" height="78" rx="14" fill="#0B1220" stroke="#06B6D4"/>
      <circle cx="27" cy="39" r="8" fill="#22C55E"/>
      <text x="50" y="34" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="2">PROFILE</text>
      <text x="50" y="57" fill="#F8FAFC" font-size="17" font-weight="700">ONLINE / BUILDING</text>
    </g>
    <g transform="translate(375 137)">
      <rect width="290" height="78" rx="14" fill="#0B1220" stroke="#7C3AED"/>
      <circle cx="27" cy="39" r="8" fill="#7C3AED"/>
      <text x="50" y="34" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="2">SCOPE</text>
      <text x="50" y="57" fill="#F8FAFC" font-size="17" font-weight="700">FULL SPECTRUM</text>
    </g>
    <g transform="translate(692 137)">
      <rect width="290" height="78" rx="14" fill="#0B1220" stroke="#0EA5E9"/>
      <circle cx="27" cy="39" r="8" fill="#0EA5E9"/>
      <text x="50" y="34" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="2">FOCUS</text>
      <text x="50" y="57" fill="#F8FAFC" font-size="17" font-weight="700">RESEARCH + TOOLS</text>
    </g>
    <g transform="translate(1009 137)">
      <rect width="333" height="78" rx="14" fill="#0B1220" stroke="#22C55E"/>
      <circle cx="27" cy="39" r="8" fill="#22C55E"/>
      <text x="50" y="34" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="2">MODE</text>
      <text x="50" y="57" fill="#F8FAFC" font-size="17" font-weight="700">LEARN • BUILD • SHIP</text>
    </g>
  </g>
</svg>
